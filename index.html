<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>친구수첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- 맨 위: 제목, 친구 수, 추가 버튼, 검색 -->
  <header class="top">
    <div class="top-row">
      <div>
        <h1>친구수첩</h1>
        <div class="count" id="count"></div>
      </div>
      <button class="add" id="addBtn" type="button" aria-label="친구 추가">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <label class="search">
      <span class="sr">친구 검색</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="이름, 별명, 사는 곳, 메모로 찾기" autocomplete="off">
    </label>
  </header>

  <!-- 보기 방식 (한눈에 / 목록) -->
  <div class="seg" role="group" aria-label="보기 방식">
    <button type="button" id="viewGlance" aria-pressed="true">한눈에</button>
    <button type="button" id="viewList" aria-pressed="false">목록</button>
  </div>

  <!-- 그룹 버튼, 생일 알림, 예시 안내 -->
  <div class="chips" id="chips" role="group" aria-label="그룹으로 걸러 보기" hidden></div>
  <button class="banner" id="banner" type="button" hidden></button>
  <div class="note" id="note" hidden></div>

  <!-- 친구 목록 -->
  <main class="list-wrap"><ul class="grid" id="list"></ul></main>

  <!-- 친구 상세 화면 -->
  <section class="sheet" id="detail" role="dialog" aria-modal="true" aria-label="친구 정보">
    <div class="sheet-bar">
      <button class="text-btn" id="detailBack" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>닫기
      </button>
      <span></span>
      <button class="text-btn" id="detailEdit" type="button">수정</button>
    </div>
    <div class="sheet-body" id="detailBody"></div>
    <div class="actions">
      <button class="btn plain danger" id="detailDelete" type="button">이 친구 지우기</button>
    </div>
  </section>

  <!-- 친구 추가 / 수정 화면 (+ 버튼을 누르면 아래에서 올라와요) -->
  <section class="sheet form" id="formSheet" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <div class="sheet-bar">
      <button class="text-btn" id="formCancel" type="button">취소</button>
      <h2 id="formTitle">친구 추가</h2>
      <button class="text-btn" id="formSave" type="submit" form="form">저장</button>
    </div>
    <form class="sheet-body" id="form" novalidate autocomplete="off">
      <div class="field" style="margin-top:4px">
        <label for="fName">이름</label>
        <input id="fName" type="text" maxlength="30" required>
        <div class="err" id="nameErr" role="alert"></div>
      </div>
      <div class="field" style="margin-top:0">
        <label for="fNick">별명</label>
        <input id="fNick" type="text" maxlength="30">
      </div>
      <div class="field">
        <label for="fPlace">사는 곳</label>
        <input id="fPlace" type="text" maxlength="30" placeholder="예: 서울 마포구">
        <div class="hint">동네까지만 적어도 돼요. 자세한 주소는 적지 않아도 돼요.</div>
      </div>
      <div class="field">
        <label for="fJob">취업 여부</label>
        <select id="fJob">
          <option value="">선택 안 함</option>
          <option value="working">취업</option>
          <option value="seeking">취업 준비 중</option>
          <option value="student">학생</option>
          <option value="rest">쉬는 중</option>
        </select>
      </div>
      <div class="field" id="fieldWrap" hidden>
        <label for="fField">분야나 종류</label>
        <input id="fField" type="text" maxlength="30" placeholder="예: IT, 교육, 제조업, 공무원">
        <div class="hint">회사 이름은 적지 않아도 돼요. 어떤 분야인지만 적어요.</div>
      </div>
      <div class="field">
        <label for="fGroup">그룹</label>
        <input id="fGroup" type="text" maxlength="20" list="groupList" placeholder="예: 학교, 동네, 모임">
        <datalist id="groupList"></datalist>
      </div>
      <div class="field">
        <label for="fPhone">전화번호</label>
        <input id="fPhone" type="tel" maxlength="20" inputmode="tel">
      </div>
      <div class="field">
        <label for="fBirthday">생일</label>
        <input id="fBirthday" type="date">
      </div>
      <div class="field">
        <label for="fLikes">좋아하는 것</label>
        <input id="fLikes" type="text" maxlength="80" placeholder="음식, 취미 등">
      </div>
      <div class="field">
        <label for="fMemo">메모</label>
        <textarea id="fMemo" maxlength="500"></textarea>
      </div>
    </form>
  </section>

  <!-- 지우기 확인 팝업 -->
  <div class="scrim" id="confirmModal" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">친구를 지울까요?</h2>
      <p id="confirmText"></p>
      <div class="row2">
        <button class="btn soft" id="confirmNo" type="button">취소</button>
        <button class="btn solid-danger" id="confirmYes" type="button">지우기</button>
      </div>
    </div>
  </div>

  <!-- 잠깐 나오는 알림 -->
  <div class="toast" id="toast" role="status"></div>
</div>

<script src="script.js"></script>
</body>
</html>
